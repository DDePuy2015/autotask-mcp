name: Release

on:
  pull_request:
    branches: [main]

# Fork safety guard. The upstream reusable release caller is intentionally not
# present in this fork: it can semantic-release, push GHCR images, create
# GitHub Releases, publish to MCP Registry through OIDC, and upload security
# results. PR verification remains in test.yml and the fork-container
# validation workflow. Image publication is available only through the
# separate manually approved GHCR-only workflow.
jobs:
  fork-release-guard:
    name: Fork release disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Confirm fork release guard
        shell: bash
        run: |
          set -euo pipefail
          echo "Fork release publishing is disabled; PR verification runs in the read-only test workflows."
