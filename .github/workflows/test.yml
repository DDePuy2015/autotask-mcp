name: Test

on:
  pull_request:
    branches:
      - main
      - next
      - next-major
      - beta
      - alpha

jobs:
  test:
    name: Test on pinned Node.js runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: https://npm.pkg.github.com

      - name: Configure npm for GitHub Packages
        run: |
          npm config set --location=user @wyre-ai:registry https://npm.pkg.github.com
          npm config set --location=user @wyre-technology:registry https://npm.pkg.github.com

      - name: Verify runtime and release regressions
        run: |
          node scripts/release-checks.mjs runtime
          node --test tests/release-controls.test.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Lint destructive tool warnings
        run: node scripts/lint-destructive-warnings.mjs src

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # Docker build check, one job per released architecture (issue #266).
  #
  # Split out of the Node matrix above, where it ran once per Node version and
  # built the same image twice. Each architecture builds NATIVELY on its own
  # runner rather than through QEMU: arm64 emulation is what turns a ~2 minute
  # image build into a 30-60 minute one, and GitHub's arm64 runners are free
  # for public repos. This gates the release build's `platforms:` at PR time,
  # so a Dockerfile change that breaks one architecture fails here instead of
  # after semantic-release has already cut a version.
  docker:
    name: Docker build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build image for ${{ matrix.platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --platform ${{ matrix.platform }} --secret id=github_token,env=NODE_AUTH_TOKEN -t autotask-mcp:test .

      # The build alone proves it compiles; this proves the result actually
      # starts on this architecture, which is the thing #266 asked for.
      - name: Verify the image runs on ${{ matrix.platform }}
        run: |
          expected="$(tr -d '\r\n' < .nvmrc)"
          docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint node autotask-mcp:test \
            -e 'if (process.versions.node !== process.argv[1]) process.exit(1); console.log(process.version + " on " + process.arch)' "$expected"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: https://npm.pkg.github.com

      - name: Configure npm for GitHub Packages
        run: |
          npm config set --location=user @wyre-ai:registry https://npm.pkg.github.com
          npm config set --location=user @wyre-technology:registry https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Lint destructive tool warnings
        run: node scripts/lint-destructive-warnings.mjs src

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
